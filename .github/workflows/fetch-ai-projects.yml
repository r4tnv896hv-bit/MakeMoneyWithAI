name: Fetch AI Projects

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  fetch-ai-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          call() { echo "=== $1"; shift; curl -sS -m 60 -o /tmp/out -w "status=%{http_code} type=%{content_type}\n" "$@"; head -c 600 /tmp/out; echo; }
          BODY='{"model":"openai/gpt-4o","messages":[{"role":"user","content":"Reply with the single word: pong"}]}'
          call "A docs curl gpt-4o" -X POST https://models.github.ai/inference/chat/completions -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" -d "$BODY"
          call "B gpt-4.1-mini" -X POST https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Reply with the single word: pong"}]}'
          call "C python UA" -X POST https://models.github.ai/inference/chat/completions -A "python-requests/2.32" -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d "$BODY"
          call "D no auth" -X POST https://models.github.ai/inference/chat/completions -H "Content-Type: application/json" -d "$BODY"
          call "E catalog" https://models.github.ai/catalog/models -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json"
          call "F legacy azure" -X POST https://models.inference.ai.azure.com/chat/completions -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Reply with the single word: pong"}]}'
          pip -q install requests
          python - <<'PY'
          import os, requests
          r = requests.post("https://models.github.ai/inference/chat/completions",
              headers={"Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}", "Content-Type": "application/json"},
              json={"model": "openai/gpt-4o", "messages": [{"role": "user", "content": "Reply with the single word: pong"}]}, timeout=60)
          print("=== G python requests", r.status_code, r.headers.get("Content-Type"), repr(r.text[:400]))
          PY
          exit 0
