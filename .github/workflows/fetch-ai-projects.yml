name: Fetch AI Projects

on:
  push:
    branches: [main] # Feature branches would otherwise get data commits pushed onto them
  workflow_dispatch: # Allows manual runs from the Actions tab
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC

permissions:
  contents: write
  models: read # Free GitHub Models inference, used when OPENAI_API_KEY is not set

# One run at a time, so two runs never race to push the generated files
concurrency:
  group: fetch-ai-projects-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-ai-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch AI projects and update markdown
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        run: python fetch_projects.py

      # After the fetch, so hand edits to the exclude/extra lists are already applied
      - name: Verify generated files
        run: python -m unittest -q

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md repos.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update AI projects list" && git push)
